  "policies": [
    {
      "id": "single-implementation-owner",
      "title": "Single implementation owner",
      "statement": "Before implementation, search for an existing implementation and record the owning module; do not create a parallel implementation of the same capability.",
      "rationale": "Parallel AI sessions otherwise duplicate the same capability and split maintenance ownership.",
      "scope": {
        "include": [
          "**/*"
        ],
        "exclude": [
          ".harness/**",
          "**/generated/**"
        ],
        "boundaries": [
          "code"
        ]
      },
      "formalization": "procedural",
      "severity": "error",
      "targets": [
        {
          "kind": "agent-instruction",
          "adapter": "portable",
          "configPath": "AGENTS.md"
        }
      ],
      "verification": {
        "commands": [
          [
            "harness-automation",
            "context",
            "--project",
            "."
          ]
        ],
        "passCriteria": "The session receipt records policy digest and implementation ownership review."
      },
      "owner": "tester",
      "sourceRefs": [
        "prd",
        "research-evidence"
      ],
      "status": "active",
      "changeControl": {
        "approvalRequired": true,
        "migrationRequired": false
      }
    },
    {
      "id": "contract-first-change",
      "title": "Contract-first interface changes",
      "statement": "Change shared API, RPC, schema, database, or queue contracts before changing consumers; update compatibility tests in the same change.",
      "rationale": "A stable source of truth prevents different sessions from implementing different interface assumptions.",
      "scope": {
        "include": [
          "**/*"
        ],
        "exclude": [
          ".harness/**"
        ],
        "boundaries": [
          "api",
          "rpc",
          "database",
          "queue"
        ]
      },
      "formalization": "cognitive",
      "severity": "error",
      "targets": [
        {
          "kind": "agent-instruction",
          "adapter": "portable",
          "configPath": ".harness/generated/effective-policy.md"
        }
      ],
      "verification": {
        "commands": [],
        "passCriteria": "Review confirms that contract sources and consumers changed together."
      },
      "owner": "tester",
      "sourceRefs": [
        "prd",
        "research-evidence"
      ],
      "status": "active",
      "changeControl": {
        "approvalRequired": true,
        "migrationRequired": false
      }
    },
    {
      "id": "generated-files-immutable",
      "title": "Generated files are immutable",
      "statement": "Never edit generated code or Harness compiler outputs directly; change their source and regenerate them.",
      "rationale": "Direct edits are overwritten and create cross-session drift.",
      "scope": {
        "include": [
          "**/generated/**",
          ".harness/generated/**"
        ],
        "exclude": [],
        "boundaries": [
          "generated-code"
        ]
      },
      "formalization": "procedural",
      "severity": "error",
      "targets": [
        {
          "kind": "agent-instruction",
          "adapter": "portable",
          "configPath": "AGENTS.md"
        }
      ],
      "verification": {
        "commands": [
          [
            "harness-automation",
            "drift",
            "--project",
            "."
          ]
        ],
        "passCriteria": "Generated output hashes match the Harness manifest."
      },
      "owner": "tester",
      "sourceRefs": [
        "prd",
        "research-evidence"
      ],
      "status": "active",
      "changeControl": {
        "approvalRequired": true,
        "migrationRequired": false
      }
    },
    {
      "id": "typescript-naming",
      "title": "TypeScript naming",
      "statement": "Use camelCase for variables, functions, parameters, methods, and local properties; PascalCase for classes, interfaces, types, enums, React components, and exported Zod schemas; UPPER_SNAKE_CASE is allowed for module constants, imported constants, and static readonly class constants. Node __dirname/__filename and the exact unused-parameter placeholder _ are allowed.",
      "rationale": "A deterministic naming gate prevents fresh sessions from alternating between camelCase and snake_case.",
      "scope": {
        "include": [
          "**/*.ts",
          "**/*.tsx"
        ],
        "exclude": [
          "**/*.d.ts",
          "**/generated/**",
          ".harness/**"
        ],
        "boundaries": [
          "code"
        ]
      },
      "formalization": "deterministic",
      "severity": "error",
      "targets": [
        {
          "kind": "linter",
          "adapter": "harness-typescript-ast"
        }
      ],
      "verification": {
        "commands": [
          [
            "harness-automation",
            "check",
            "--project",
            "."
          ]
        ],
        "passCriteria": "The AST naming verifier passes its invalid fixture and the repository contains no unapproved violations."
      },
      "examples": {
        "valid": [
          "const userId = 1",
          "class UserService {}"
        ],
        "invalid": [
          "const user_id = 1",
          "class user_service {}"
        ]
      },
