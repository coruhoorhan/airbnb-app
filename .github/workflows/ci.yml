name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies & Build
        run: |
          npm ci || npm install
          npm run build

      - name: Validate agent task manifest
        run: python3 scripts/validate_agent_tasks.py agent_tasks.json

      - name: Run AST Smoke Check
        run: |
          python3 -c "
          import ast, os
          for root, _, files in os.walk('.'):
              if any(d in root for d in ['node_modules', '.git', 'dist']): continue
              for f in files:
                  if f.endswith('.py'):
                      ast.parse(open(os.path.join(root, f)).read())
          print('CI AST Smoke Check Passed.')
          "
