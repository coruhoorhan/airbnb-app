name: 2. Trigger Next Autonomous Task via Jules API

on:
  pull_request:
    types: [closed]
    branches: [main]
  workflow_dispatch:

jobs:
  next-task:
    runs-on: ubuntu-latest
    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event.pull_request.merged == true &&
       (github.event.pull_request.user.login == 'google-jules[bot]' ||
        github.event.pull_request.user.login == 'coruhoorhan'))

    steps:
      - name: Trigger Google Jules via Official API
        run: |
          PROMPT=$(cat <<'EOF'
          You are building and enhancing the Airbnb Fatsa Clone full-stack application (React, Node.js, Express, SQLite, Magda-Agent Cognitive System).

          TASK:
          1. Read AGENTS.md, MASTER_ROADMAP.md, and open agent_tasks.json in the repo root (the ONLY task manifest).
          2. STRICT RULE: Look ONLY at the "tasks" array. Find the FIRST task where status is STRICTLY "todo". Never touch archived_tasks or status: "done".
          3. Implement the ENTIRE task as described (backend API / frontend components / database operations).
          4. Update agent_tasks.json: set the completed task status to "done".
          5. Respect the allowed_paths declared by the selected task.
          6. Write clean, modular, production-ready code with error handling.
          7. Run python3 scripts/validate_agent_tasks.py agent_tasks.json mentally to ensure schema conformance.
          8. NEVER ask the user anything. Decide and proceed autonomously. Implement the task, update agent_tasks.json, and open ONE complete PR.

          STRICT RULES:
          - Implement the full feature in one PR. Do NOT split into smaller PRs.
          - Do not touch files outside allowed_paths unless explicitly required by the task.
          - Follow existing code style in server.js, src/lib/db.js, and src/components/.
          - Do NOT modify .github/workflows/** or secrets unless the task explicitly permits it.
          - If the task has risk "high" or "critical", create the PR for review.
          EOF
          )

          curl -f 'https://jules.googleapis.com/v1alpha/sessions' \
            -X POST \
            -H "Content-Type: application/json" \
            -H "X-Goog-Api-Key: ${{ secrets.JULES_API_KEY }}" \
            -d "$(jq -n \
              --arg prompt "$PROMPT" \
              --arg source "sources/github/${{ github.repository }}" \
              '{
                "prompt": $prompt,
                "sourceContext": {"source": $source, "githubRepoContext": {"startingBranch": "main"}},
                "automationMode": "AUTO_CREATE_PR",
                "title": "Autonomous Airbnb Feature Implementation"
              }')"
