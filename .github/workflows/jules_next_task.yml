name: 2. Trigger Next Autonomous Task via Jules API
on:
  pull_request:
    types: [closed]
    branches: [main]
  push:
    branches: [main]
    paths:
      - "agent_tasks.json"
  workflow_dispatch:
    inputs:
      force:
        description: "Force trigger next task"
        required: false
        default: "false"

jobs:
  next-task:
    runs-on: ubuntu-latest
    if: >
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'push' ||
      (github.event_name == 'pull_request' && github.event.pull_request.merged == true)
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}

      - name: Check task queue and anti-duplicate active session guard
        id: task_check
        env:
          JULES_API_KEY: ${{ secrets.JULES_API_KEY }}
          FORCE: ${{ inputs.force }}
        run: |
          python3 - <<'PYEOF'
          import json, os, sys, urllib.request

          manifest_path = "agent_tasks.json"
          if not os.path.exists(manifest_path):
              print("agent_tasks.json missing! Halting.")
              sys.exit(1)

          with open(manifest_path, "r", encoding="utf-8") as f:
              data = json.load(f)

          tasks = data.get("tasks", [])
          todos = [t for t in tasks if t.get("status") == "todo" and t.get("claimed_by") not in ("human", "veyyon")]

          print(f"Total tasks: {len(tasks)} | Active unblocked TODOs: {len(todos)}")
          out_path = os.environ.get("GITHUB_OUTPUT", "/dev/null")

          if not todos:
              print("No remaining TODO tasks in queue. Jules is idle.")
              with open(out_path, "a", encoding="utf-8") as out:
                  out.write("should_run=false\n")
              sys.exit(0)

          # Anti-duplicate guard: Check if an active Jules session is already running
          jules_key = os.environ.get("JULES_API_KEY", "").strip()
          force = os.environ.get("FORCE", "false").lower() == "true"

          if jules_key and not force:
              try:
                  req = urllib.request.Request(
                      "https://jules.googleapis.com/v1alpha/sessions?pageSize=20",
                      headers={"X-Goog-Api-Key": jules_key, "Accept": "application/json"}
                  )
                  with urllib.request.urlopen(req, timeout=30) as resp:
                      raw_s = json.load(resp).get("sessions", [])

                  active_states = {"QUEUED", "PLANNING", "IN_PROGRESS", "AWAITING_USER_FEEDBACK", "AWAITING_PLAN_APPROVAL"}
                  running = [s for s in raw_s if s.get("state") in active_states and "Autonomous Airbnb" in s.get("title", "")]

                  if running:
                      print(f"⚠️ A Jules session is ALREADY actively running: {running[0].get('name')} (State: {running[0].get('state')}).")
                      print("Skipping duplicate session spawn to prevent queue congestion.")
                      with open(out_path, "a", encoding="utf-8") as out:
                          out.write("should_run=false\n")
                      sys.exit(0)
              except Exception as e:
                  print(f"Active session check warning ({e}); proceeding cautiously.")

          next_t = todos[0]
          print(f"✅ Dispatching next task to Jules: [{next_t.get('id')}] {next_t.get('title')}")
          with open(out_path, "a", encoding="utf-8") as out:
              out.write("should_run=true\n")
              out.write("next_task_id=" + str(next_t.get("id")) + "\n")
              out.write("next_task_title=" + str(next_t.get("title")) + "\n")
          PYEOF

      - name: Trigger Google Jules via Official API
        if: steps.task_check.outputs.should_run == 'true'
        run: |
          PROMPT=$(cat <<'EOF'
          You are building and enhancing the Airbnb Fatsa Clone full-stack application (React, Node.js, Express, SQLite, GraphQL).

          TASK:
          1. Open agent_tasks.json in the repository root (the single source of truth task manifest).
          2. STRICT RULE: Look ONLY at the "tasks" array. Find the FIRST task where status is "todo" AND is NOT claimed by human/veyyon (skip tasks where claimed_by == "human" or "veyyon").
          3. Set claimed_by: "jules" and status: "in_progress" when you begin work.
          4. Implement the ENTIRE task as described (backend API / frontend components / database operations).
          5. Update agent_tasks.json: set the completed task status to "done".
          6. Respect the allowed_paths declared by the selected task.
          7. Write clean, modular, production-ready code with error handling.
          8. Run python3 scripts/validate_agent_tasks.py agent_tasks.json mentally to ensure schema conformance.
          9. FULLY AUTONOMOUS: there is NO human to answer you. NEVER ask questions, NEVER wait for confirmation, NEVER ask "Should I proceed with opening PR?". Proceed and open the PR immediately.

          STRICT RULES:
          - Implement the full feature in one PR. Do NOT split into smaller PRs.
          - Do not touch files outside allowed_paths unless explicitly required by the task.
          - Follow existing code style in server.js, src/lib/db.js, and src/components/.
          - Do NOT modify .github/workflows/** or secrets unless the task explicitly permits it.
          - NEVER create patch_*.py, fix_*.py, or scratch helper scripts inside the repo. Edit source files directly.
          - Every PR must include focused tests for the new behavior; keep the diff minimal (task files + tests only).
          EOF
          )
          curl -f 'https://jules.googleapis.com/v1alpha/sessions'             -X POST             -H "Content-Type: application/json"             -H "X-Goog-Api-Key: ${{ secrets.JULES_API_KEY }}"             -d "$(jq -n               --arg prompt "$PROMPT"               --arg source "sources/github/${{ github.repository }}"               '{
                "prompt": $prompt,
                "sourceContext": {"source": $source, "githubRepoContext": {"startingBranch": "main"}},
                "automationMode": "AUTO_CREATE_PR",
                "title": "Autonomous Airbnb Feature Implementation"
              }')"
