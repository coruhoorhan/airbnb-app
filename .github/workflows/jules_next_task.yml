name: 2. Trigger Next Autonomous Task via Jules API
on:
  pull_request:
    types: [closed]
    branches: [main]
  workflow_dispatch:
    inputs:
      force:
        description: "Force trigger next task"
        required: false
        default: "false"

jobs:
  next-task:
    runs-on: ubuntu-latest
    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request' && github.event.pull_request.merged == true)
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}

      - name: Check task queue, Anti-Repeat Locks & Smart Quota Governor
        id: task_check
        env:
          JULES_API_KEY: ${{ secrets.JULES_API_KEY }}
          GH_PAT: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          FORCE: ${{ inputs.force }}
        run: |
          python3 - <<'PYEOF'
          import json, os, sys, urllib.request, re
          from datetime import datetime, timezone

          out_path = os.environ.get("GITHUB_OUTPUT", "/dev/null")
          def halt(reason: str):
              print(f"🛑 [GOVERNOR HALT]: {reason}")
              with open(out_path, "a", encoding="utf-8") as out:
                  out.write("should_run=false\n")
              sys.exit(0)

          manifest_path = "agent_tasks.json"
          if not os.path.exists(manifest_path):
              halt("agent_tasks.json missing!")

          with open(manifest_path, "r", encoding="utf-8") as f:
              data = json.load(f)

          tasks = data.get("tasks", [])
          todos = [t for t in tasks if t.get("status") == "todo" and t.get("claimed_by") not in ("human", "veyyon")]

          print(f"Total tasks: {len(tasks)} | Active TODOs: {len(todos)}")
          if not todos:
              halt("No remaining TODO tasks in queue. Jules is idle.")

          next_t = todos[0]
          next_id = str(next_t.get("id", "")).strip()
          next_title = str(next_t.get("title", "")).strip()
          force = os.environ.get("FORCE", "false").lower() == "true"

          print(f"👉 Next Candidate Task: [{next_id}] {next_title}")

          gh_token = os.environ.get("GH_PAT", "").strip()
          repo = os.environ.get("REPO", "coruhoorhan/airbnb-app").strip()

          # --- 1. ANTI-REPEAT LOCK (Check Open & Merged PRs) ---
          if gh_token and not force:
              try:
                  # Check Open PRs: Halt if any PR is open
                  req_pr = urllib.request.Request(
                      f"https://api.github.com/repos/{repo}/pulls?state=open&per_page=50",
                      headers={"Authorization": f"Bearer {gh_token}", "Accept": "application/vnd.github+json"}
                  )
                  with urllib.request.urlopen(req_pr, timeout=20) as resp:
                      open_prs = json.loads(resp.read().decode())

                  if len(open_prs) > 0:
                      halt(f"There are already {len(open_prs)} open PRs pending review/merge. Resolving current PRs first.")

                  # Check recently closed/merged PRs to avoid re-dispatching already merged tasks
                  req_closed = urllib.request.Request(
                      f"https://api.github.com/repos/{repo}/pulls?state=closed&per_page=30",
                      headers={"Authorization": f"Bearer {gh_token}", "Accept": "application/vnd.github+json"}
                  )
                  with urllib.request.urlopen(req_closed, timeout=20) as resp:
                      closed_prs = json.loads(resp.read().decode())

                  candidate_already_merged = False
                  for cpr in closed_prs:
                      if not cpr.get("merged_at"):
                          continue
                      cp_title = cpr.get("title", "").lower()
                      cp_branch = cpr.get("head", {}).get("ref", "").lower()
                      if next_id.lower() in cp_title or next_id.lower() in cp_branch:
                          candidate_already_merged = True
                          print(f"⚠️ Task [{next_id}] was already merged in PR #{cpr.get('number')}. Auto-marking done.")
                          next_t["status"] = "done"
                          next_t["completed_at"] = time.time()
                          with open(manifest_path, "w", encoding="utf-8") as f:
                              json.dump(data, f, indent=2, ensure_ascii=False)
                          break

                  if candidate_already_merged:
                      todos = [t for t in tasks if t.get("status") == "todo" and t.get("claimed_by") not in ("human", "veyyon")]
                      if not todos:
                          halt("All tasks completed after advancing merged candidate.")
                      next_t = todos[0]
                      next_id = str(next_t.get("id", "")).strip()
                      next_title = str(next_t.get("title", "")).strip()
                      print(f"👉 Advanced to Next Candidate Task: [{next_id}] {next_title}")
              except Exception as e:
                  print(f"Warning checking PR anti-repeat status: {e}")
          # --- 2. JULES SESSION CONCURRENCY & QUOTA GOVERNOR ---
          jules_key = os.environ.get("JULES_API_KEY", "").strip()
          if jules_key and not force:
              try:
                  req_s = urllib.request.Request(
                      "https://jules.googleapis.com/v1alpha/sessions?pageSize=50",
                      headers={"X-Goog-Api-Key": jules_key, "Accept": "application/json"}
                  )
                  with urllib.request.urlopen(req_s, timeout=20) as resp:
                      raw_s = json.load(resp).get("sessions", [])

                  today_prefix = datetime.now(timezone.utc).strftime("%Y-%m-%d")
                  today_count = sum(1 for s in raw_s if (s.get("createTime") or "").startswith(today_prefix))
                  print(f"📊 Jules Daily Session Usage: {today_count} / 100 sessions today")

                  # Max 20 automated sessions per day to prevent runaway quota burn
                  if today_count >= 20:
                      halt(f"Daily hard quota limit reached ({today_count} sessions). Cooling down until tomorrow.")

                  active_states = {"QUEUED", "PLANNING", "IN_PROGRESS", "AWAITING_USER_FEEDBACK", "AWAITING_PLAN_APPROVAL"}
                  running = [s for s in raw_s if s.get("state") in active_states]
                  if len(running) >= 1:
                      halt(f"Concurrency Guard: An active Jules session ({len(running)}) is already running.")
              except Exception as e:
                  print(f"Warning checking Jules quota: {e}")

          print(f"✅ Dispatched task to Jules: [{next_id}] {next_title}")
          with open(out_path, "a", encoding="utf-8") as out:
              out.write("should_run=true\n")
              out.write("next_task_id=" + next_id + "\n")
              out.write("next_task_title=" + next_title + "\n")
          PYEOF

      - name: Trigger Google Jules via Official API
        if: steps.task_check.outputs.should_run == 'true'
        run: |
          PROMPT=$(cat <<'EOF'
          You are building and enhancing the Airbnb Fatsa Clone full-stack application (React, Node.js, Express, SQLite, GraphQL).

          TASK:
          1. Open agent_tasks.json in the repository root (the single source of truth task manifest).
          2. STRICT RULE: Look ONLY at the "tasks" array. Find the FIRST task where status is "todo" AND is NOT claimed by human/veyyon (skip tasks where claimed_by == "human" or "veyyon").
          3. Set claimed_by: "jules" and status: "in_progress" when you begin work.
          4. Implement the ENTIRE task as described (backend API / frontend components / database operations).
          5. Update agent_tasks.json: set the completed task status to "done".
          6. Respect the allowed_paths declared by the selected task.
          7. Write clean, modular, production-ready code with error handling.
          8. Run python3 scripts/validate_agent_tasks.py agent_tasks.json mentally to ensure schema conformance.
          9. FULLY AUTONOMOUS: there is NO human to answer you. NEVER ask questions, NEVER wait for confirmation, NEVER ask "Should I proceed with opening PR?". Proceed and open the PR immediately.

          STRICT RULES:
          - Implement the full feature in one PR. Do NOT split into smaller PRs.
          - Do not touch files outside allowed_paths unless explicitly required by the task.
          - Follow existing code style in server.js, src/lib/db.js, and src/components/.
          - Do NOT modify .github/workflows/** or secrets unless the task explicitly permits it.
          - NEVER create patch_*.py, fix_*.py, or scratch helper scripts inside the repo. Edit source files directly.
          - Every PR must include focused tests for the new behavior; keep the diff minimal (task files + tests only).
          EOF
          )
          curl -f 'https://jules.googleapis.com/v1alpha/sessions' \
            -X POST \
            -H "Content-Type: application/json" \
            -H "X-Goog-Api-Key: ${{ secrets.JULES_API_KEY }}" \
            -d "$(jq -n \
              --arg prompt "$PROMPT" \
              --arg source "sources/github/${{ github.repository }}" \
              '{
                "prompt": $prompt,
                "sourceContext": {"source": $source, "githubRepoContext": {"startingBranch": "main"}},
                "automationMode": "AUTO_CREATE_PR",
                "title": "Autonomous Airbnb Feature Implementation"
              }')"
