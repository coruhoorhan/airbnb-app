name: 1. Auto-Validate and Merge Jules PRs
on:
  pull_request:
    branches:
      - main

permissions:
  contents: write
  pull-requests: write

jobs:
  test-and-merge:
    runs-on: ubuntu-latest
    if: >
      github.event.pull_request.user.login == 'google-jules[bot]' ||
      github.event.pull_request.user.login == 'coruhoorhan' ||
      contains(github.event.pull_request.labels.*.name, 'jules') ||
      startsWith(github.event.pull_request.head.ref, 'fix-') ||
      startsWith(github.event.pull_request.head.ref, 'feat-') ||
      startsWith(github.event.pull_request.head.ref, 'chore-')
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}

      - name: Auto-Sync branch with main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git merge origin/main --no-edit || echo "Auto-merge with main completed/skipped"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Magda AI Code Auditor
        env:
          GH_PAT: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_BASE_URL: https://api.inceptionlabs.ai/v1
          OPENAI_MODEL: mercury-2
        run: |
          python3 scripts/pr_code_auditor.py ${{ github.event.pull_request.number }} ${{ github.repository }}

      - name: Validate agent task manifest
        run: python3 scripts/validate_agent_tasks.py agent_tasks.json

      - name: Install dependencies & Build
        run: |
          npm ci || npm install
          npm run build

      - name: Run Vitest Suite & Synthetic E2E User Journeys
        run: |
          npm test
      - name: AST Smoke Check
        run: |
          python3 -c "
          import ast, os
          for root, _, files in os.walk('.'):
              if any(d in root for d in ['node_modules', '.git', 'dist']): continue
              for f in files:
                  if f.endswith('.py'):
                      ast.parse(open(os.path.join(root, f)).read())
          print('AST Smoke Check Passed.')
          "

      - name: Auto-approve and Merge PR
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}
        run: |
          gh pr review ${{ github.event.pull_request.number }} --approve || true
          gh pr merge ${{ github.event.pull_request.number }} --merge --delete-branch || gh pr merge ${{ github.event.pull_request.number }} --admin --merge --delete-branch || true
