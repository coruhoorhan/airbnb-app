name: 3. Jules Auto-Responder (no-human loop)

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run (list only, send nothing)"
        required: false
        default: "true"
  workflow_run:
    workflows: ["1. Auto-Validate and Merge Jules PRs", "2. Trigger Next Autonomous Task via Jules API", "4. Jules Revision Trigger (auditor feedback loop)"]
    types: [completed]

permissions:
  contents: read
  issues: write

jobs:
  respond:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Poll Jules sessions and auto-answer
        env:
          JULES_API_KEY: ${{ secrets.JULES_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_BASE_URL: https://api.inceptionlabs.ai/v1
          OPENAI_MODEL: mercury-2
          GH_PAT: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}
          TARGET_REPO: ${{ github.repository }}
          TARGET_TITLE: Autonomous Airbnb,Revise airbnb-app PR,Revise PR #
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.dry_run }}" = "true" ]; then
            python3 scripts/jules_responder.py --dry-run
          else
            python3 scripts/jules_responder.py
          fi
